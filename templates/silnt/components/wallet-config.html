<div>
  <q-card v-if="canEditConfig">
    <div class="row items-center no-wrap q-mb-md q-pt-sm q-pb-sm">
      <div class="col-lg-2 col-sm-3 q-ml-lg">
        <q-btn          
        unelevated @click="show = true" 
        color="primary" 
        icon="settings">
        </q-btn>
      </div>      
    </div>
  </q-card>

  <q-dialog  v-if="canEditConfig" v-model="show" position="top">
    <q-card class="q-pa-lg q-pt-xl lnbits__dialog-card">
      <q-form @submit="updateConfig" class="q-gutter-md">            
        <q-input
          filled
          dense
          v-model.trim="config.blindbit_url"
          type="text"
          label="BlindBit Oracle URL"          
        >
        </q-input>
        <q-input
        filled
        dense
        v-model.trim="config.mempool_url"
        type="text"
        label="Mempool URL"
        hint="Default: https://mempool.space"
        ></q-input>                        

        <div class="row q-mt-lg">
          <q-btn
            unelevated
            color="primary"
            :disable="!config.blindbit_url"
            type="submit"
            >Update</q-btn
          >
          <q-btn v-close-popup flat color="grey" class="q-ml-auto"
            >Cancel</q-btn
          >
        </div>
      </q-form>
    </q-card>
  </q-dialog>
</div>
